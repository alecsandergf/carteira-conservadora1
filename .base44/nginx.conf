# Workers run as root because the bind-mounted repo root is mode 700 (root-only).
user root;
worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    root /app;
    charset utf-8;
    add_header Cache-Control "no-store";
    location = / {
      try_files "/Alocação de Referência.html" =404;
    }
  }
}
