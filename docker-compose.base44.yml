services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/app:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js:ro
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: node server.js
    restart: unless-stopped
